[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "metactl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
[project.scripts]
metactl = "metactl.cli:main"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
